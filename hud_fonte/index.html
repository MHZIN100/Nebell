<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="nebell-hud-versao" content="__VERSAO__">
<title>N.E.B.E.L.L.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-state="idle">
<div class="app">
 <header><h1>N.E.B.E.L.L.</h1><div class="clock"><b id="clk">--:--:--</b><span id="dt"></span></div></header>
 <main>
  <section class="panel"><h2>SISTEMA</h2>
   <div class="stat"><div><span>CPU</span><span id="cpuV">--</span></div><div class="bar"><i id="cpu"></i></div></div>
   <div class="stat"><div><span>MEMÓRIA</span><span id="ramV">--</span></div><div class="bar"><i id="ram"></i></div></div>
   <div class="stat"><div><span>GPU</span><span id="gpuV">--</span></div><div class="bar"><i id="gpu"></i></div></div>
   <div class="stat"><div><span>REDE</span><span id="netV">--</span></div><div class="bar"><i id="net"></i></div></div>
   <div class="stat"><div><span>MODELO</span><span id="mdl">qwen3.5:4b</span></div></div>
   <div class="stat"><div><span>VOZ</span><span id="voz">Piper · nebell</span></div></div>
   <div class="stat"><div><span>RECONHECIMENTO</span><span id="stt">--</span></div></div>
   <div class="stat"><div><span>MICROFONE</span><span id="micV">--</span></div></div>
   <div class="stat"><div><span>LOCAL</span><span id="loc">--</span></div></div>
   <div class="vozpick">
    <label for="vozSel">MODELO DE VOZ</label>
    <select id="vozSel"><option value="">—</option></select>
   </div>
  </section>
  <section class="panel conversa"><h2>CONVERSA</h2><div id="log"></div></section>
  <aside class="hudbox"><canvas id="hud"></canvas><div id="state">EM ESPERA</div><div id="sub">DIGA "NEBELL" PARA COMEÇAR</div><div id="work"></div></aside>
 </main>
 <footer>
  <div class="in"><span>&gt;</span><input id="txt" placeholder="Digite uma mensagem e pressione Enter" autocomplete="off"></div>
  <label id="micbtn" class="iconbtn" title="Microfone de entrada">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>
   <select id="mic"><option value="auto">MICROFONE: AUTOMÁTICO</option></select>
  </label>
  <button id="micmute" class="iconbtn" title="Silenciar o microfone" aria-pressed="false">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/><line x1="3" y1="3" x2="21" y2="21" stroke-width="2.2"/></svg>
  </button>
  <button id="file" class="iconbtn" title="Enviar um arquivo ou imagem para o NEBELL">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
  </button>
  <div class="effort-wrap">
   <button id="effort" class="iconbtn" title="Nível de esforço do modelo. Clique para abrir a barra.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a9 9 0 1 1 17 0"/><line x1="12" y1="15" x2="16" y2="9.8"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
   </button>
   <div id="effort-pop" class="effort-pop" hidden>
    <div class="ep-titulo">ESFORÇO</div>
    <div class="ep-nome" id="ep-nome">MÉDIA</div>
    <div class="ef-track" id="ef-track" data-nivel="normal">
     <div class="ef-fill" id="ef-fill"><canvas id="ef-canvas"></canvas></div>
     <div class="ef-ball" id="ef-ball"></div>
    </div>
    <div class="ep-legenda"><span>Instantânea</span><span>Média</span><span>Alta</span></div>
   </div>
  </div>
  <button id="halt" class="iconbtn" title="Interrompe a fala e a geração">
   <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
  </button>
 </footer>
</div>
<script src="formas.js"></script>
<script src="app.js"></script>
</body>
</html>
