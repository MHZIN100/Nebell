<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="nebell-hud-versao" content="__VERSAO__">
<title>N.E.B.E.L.L.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body data-state="idle" data-bigbang="__BIGBANG__">
<div class="estrelas" aria-hidden="true"></div>
<div class="app">
 <header><h1>N.E.B.E.L.L.</h1><div class="clock"><b id="clk">--:--</b><span id="dt"></span></div></header>
 <main>
  <section class="panel sistema"><h2>Sistema</h2>
   <div class="bloco">
    <div class="bloco-tit">Telemetria</div>
    <div class="stat"><div><span>CPU</span><span id="cpuV">--</span></div><div class="bar"><i id="cpu"></i></div></div>
    <div class="stat"><div><span>Memória</span><span id="ramV">--</span></div><div class="bar"><i id="ram"></i></div></div>
    <div class="stat"><div><span>GPU</span><span id="gpuV">--</span></div><div class="bar"><i id="gpu"></i></div></div>
    <div class="stat"><div><span>Rede</span><span id="netV">--</span></div><div class="bar"><i id="net"></i></div></div>
   </div>
   <div class="bloco">
    <div class="bloco-tit">Sessão</div>
    <div class="linhainfo"><span>Modelo</span><span id="mdl">qwen3.5:4b</span></div>
    <div class="linhainfo"><span>Voz</span><span id="voz">Piper · nebell</span></div>
    <div class="linhainfo"><span>Reconhecimento</span><span id="stt">--</span></div>
    <div class="linhainfo"><span>Microfone</span><span id="micV">--</span></div>
    <div class="linhainfo"><span>Local</span><span id="loc">--</span></div>
   </div>
   <div class="controles">
    <div class="campo"><label for="modelo">Modelo (cérebro)</label>
     <select id="modelo">
      <option value="auto">Automático (avisa)</option>
      <option value="geral">Geral</option>
      <option value="codigo">Programação</option>
     </select></div>
    <div class="campo"><label for="vozSel">Modelo de voz</label>
     <select id="vozSel"><option value="">—</option></select></div>
    <div class="campo"><label for="mic">Microfone de entrada</label>
     <select id="mic"><option value="auto">Automático</option></select></div>
   </div>
  </section>
  <section class="panel conversa">
   <div class="conversa-cab">
    <h2>Conversa</h2>
    <div class="hist-wrap">
     <button id="hist" class="iconbtn fino" title="Histórico de conversas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15 14"/></svg>
     </button>
     <div id="hist-pop" class="hist-pop" hidden>
      <div class="hist-cab">Histórico</div>
      <button id="hist-nova" type="button" class="hist-nova">
       <span class="hist-mais">+</span> Nova conversa
      </button>
      <div id="hist-lista" class="hist-lista"></div>
     </div>
    </div>
   </div>
   <div id="log"></div>
  </section>
  <aside class="panel hudbox">
   <div class="nucleo"><div class="aura" aria-hidden="true"></div><canvas id="hud"></canvas></div>
   <div class="status">
    <div class="status-linha"><span class="viva" aria-hidden="true"></span><div id="state">EM ESPERA</div></div>
    <div id="sub">Clique no microfone ou digite</div>
    <div id="work"></div>
   </div>
  </aside>
 </main>
 <footer>
  <div class="in">
   <button id="cancelar" class="in-x" title="Cancelar a gravação" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
   </button>
   <span id="prompt">&gt;</span>
   <input id="txt" placeholder="Escreva uma mensagem…" autocomplete="off">
  </div>
  <button id="micbtn" class="iconbtn" title="Clique para falar" data-modo="mic">
   <svg class="ic ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>
   <svg class="ic ic-enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/></svg>
   <svg class="ic ic-parar" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
  <button id="file" class="iconbtn" title="Enviar um arquivo ou imagem para o NEBELL">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
  </button>
  <div class="effort-wrap">
   <button id="effort" class="iconbtn" title="Nível de esforço do modelo. Clique para abrir a barra.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a9 9 0 1 1 17 0"/><line x1="12" y1="15" x2="16" y2="9.8"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
   </button>
   <div id="effort-pop" class="effort-pop" hidden>
    <div class="ep-titulo">ESFORÇO</div>
    <div class="ep-nome" id="ep-nome">MÉDIA</div>
    <div class="ef-track" id="ef-track" data-nivel="normal">
     <div class="ef-fill" id="ef-fill"><canvas id="ef-canvas"></canvas></div>
     <div class="ef-ball" id="ef-ball"></div>
    </div>
    <div class="ep-legenda"><span>Instantânea</span><span>Média</span><span>Alta</span></div>
   </div>
  </div>
 </footer>
</div>
<script src="formas.js"></script>
<script src="app.js"></script>
</body>
</html>
